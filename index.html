<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tzeroky Icons</title>
  <style>
    :root{color-scheme:dark;background:#111116;color:#f4f1fa;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{max-width:1080px;margin:0 auto;padding:48px 24px}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:24px;margin:0}p{font-size:13px;color:#aaa8b6;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}.item{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:18px;background:#19191f;box-shadow:0 8px 22px #0005,inset 0 1px #ffffff08;color:#aaa8b6;text-decoration:none;font-size:11px;transition:transform .16s,color .16s}.item:hover{transform:translateY(-2px);color:#d8ceff}.item svg{width:24px;height:24px;color:#a996ff;stroke:currentColor;fill:none}.item code{font:inherit}@media(max-width:520px){body{padding:28px 16px}.heading{align-items:flex-start;flex-direction:column;gap:8px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.item{min-height:96px}}
  </style>
</head>
<body>
  <header class="heading"><h1>Tzeroky Icons</h1><p>Original SVG sources · 24 × 24 · currentColor</p></header>
  <main class="grid">
    <a class="item" href="brand-wave.svg"><svg><use href="brand-wave.svg#icon"/></svg><code>brand-wave</code></a>

    <a class="item" href="audio-wave.svg"><svg><use href="audio-wave.svg#icon"/></svg><code>audio-wave</code></a>
    <a class="item" href="clock.svg"><svg><use href="clock.svg#icon"/></svg><code>clock</code></a>
    <a class="item" href="tempo.svg"><svg><use href="tempo.svg#icon"/></svg><code>tempo</code></a>
    <a class="item" href="settings.svg"><svg><use href="settings.svg#icon"/></svg><code>settings</code></a>
    <a class="item" href="settings-rounded.svg"><svg><use href="settings-rounded.svg#icon"/></svg><code>settings-rounded</code></a>
    <a class="item" href="settings-solid.svg"><svg><use href="settings-solid.svg#icon"/></svg><code>settings-solid</code></a>
    <a class="item" href="dice.svg"><svg><use href="dice.svg#icon"/></svg><code>dice</code></a>

    <a class="item" href="file-name.svg"><svg><use href="file-name.svg#icon"/></svg><code>file-name</code></a>
    <a class="item" href="sparkle.svg"><svg><use href="sparkle.svg#icon"/></svg><code>sparkle</code></a>
    <a class="item" href="refresh.svg"><svg><use href="refresh.svg#icon"/></svg><code>refresh</code></a>

</body>
</html>
